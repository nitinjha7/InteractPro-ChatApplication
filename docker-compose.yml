services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devchat
      POSTGRES_USER: devchat
      POSTGRES_PASSWORD: devchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devchat -d devchat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
